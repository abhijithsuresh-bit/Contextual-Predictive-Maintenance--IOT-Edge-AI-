stages:
  data_ingestion:
    cmd: python src/data/data_ingestion.py
    deps:
      - src/data/data_ingestion.py
      - params.yaml
      - ai4i2020.csv
    outs:
      - data/processed

  data_preprocessing:
    cmd: python src/data/data_preprocessing.py
    deps:
      - src/data/data_preprocessing.py
      - params.yaml
      - data/processed/cleaned_data.csv

    outs:
      - data/preprocessed